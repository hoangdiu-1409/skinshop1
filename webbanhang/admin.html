<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập quản trị</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f6f7f4; --ink: #1d2a2e; --muted: #5d6b6f;
      --line: #d5dad6; --accent: #1f6f5c; --danger: #b3382c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--paper); color: var(--ink);
      font-family: "Be Vietnam Pro", system-ui, sans-serif;
    }
    main { width: min(380px, 92vw); }
    h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
    p.sub { margin: 0 0 1.5rem; color: var(--muted); }
    form { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 1.5rem; }
    label { display: block; font-weight: 500; margin-bottom: .35rem; }
    input {
      width: 100%; padding: .65rem .75rem; margin-bottom: 1rem;
      border: 1px solid var(--line); border-radius: 6px; font: inherit;
    }
    input:focus-visible, button:focus-visible { outline: 3px solid #8fc9b9; outline-offset: 1px; }
    button {
      width: 100%; padding: .7rem; border: 0; border-radius: 6px;
      background: var(--accent); color: #fff; font: inherit; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #error { min-height: 1.4rem; margin: 0 0 .75rem; color: var(--danger); font-size: .9rem; }
    .demo { margin-top: 1rem; font-size: .85rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Đăng nhập quản trị</h1>
    <p class="sub">Chỉ dành cho quản lý cửa hàng.</p>

    <form id="loginForm" novalidate>
      <label for="username">Tên đăng nhập</label>
      <input id="username" name="username" autocomplete="username" required autofocus>

      <label for="password">Mật khẩu</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <p id="error" role="alert"></p>
      <button type="submit" id="submitBtn">Đăng nhập</button>
    </form>

    <p class="demo" id="demoNote" hidden>
      Chế độ demo (chưa có backend): dùng <b>admin</b> / <b>admin123</b>.
    </p>
  </main>

  <script>
    // Để trống = chế độ demo. Khi có backend, điền địa chỉ API (cùng giá trị với admin.html).
    const API_BASE = "";

    const form = document.getElementById("loginForm");
    const errorEl = document.getElementById("error");
    const btn = document.getElementById("submitBtn");
    if (!API_BASE) document.getElementById("demoNote").hidden = false;

    // Đã đăng nhập rồi thì vào thẳng trang quản trị
    if (sessionStorage.getItem("adminToken")) location.replace("admin.html");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      const username = form.username.value.trim();
      const password = form.password.value;
      if (!username || !password) {
        errorEl.textContent = "Nhập đầy đủ tên đăng nhập và mật khẩu.";
        return;
      }
      btn.disabled = true;
      try {
        let token;
        if (API_BASE) {
          const res = await fetch(API_BASE + "/api/admin/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || "Sai tên đăng nhập hoặc mật khẩu.");
          token = data.token;
        } else {
          // CHỈ DÙNG ĐỂ THỬ GIAO DIỆN: kiểm tra mật khẩu ở trình duyệt không an toàn.
          if (username !== "admin" || password !== "admin123") {
            throw new Error("Sai tên đăng nhập hoặc mật khẩu.");
          }
          token = "demo-token";
        }
        sessionStorage.setItem("adminToken", token);
        location.href = "admin.html";
      } catch (err) {
        errorEl.textContent = err.message;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
